name: Recordatorio de aprobación

on:
  # La hora la lleva el bot de registro (scripts/bot-registro.mjs), porque los horarios de GitHub no son confiables.
  # Domingo 12:00 pm de Ciudad de México.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  recordar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Recordar semanas sin aprobar
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MENTOR_CHAT_ID: ${{ secrets.MENTOR_CHAT_ID }}
        run: |
          gh pr list --state open --json url,title,headRefName -q '.[] | select(.headRefName | startswith("claude/semana-")) | [(.headRefName | sub("^claude/"; "")), .url, .title] | @tsv' |
          while IFS=$'\t' read -r SEMANA URL TITULO; do node scripts/notificar.mjs recordatorio "$SEMANA" "$URL" "$TITULO"; done
