name: Semana propuesta

# Cuando una semana nueva llega a una rama claude/semana-NN (por push o porque el flujo
# "Generar semana" la subió), abre o actualiza el PR de revisión y avisa al mentor por Telegram.
on:
  push:
    branches: ["claude/semana-*"]
  workflow_dispatch:
    inputs:
      rama:
        description: "Rama de la semana propuesta (ej. claude/semana-02)"
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  proponer:
    runs-on: ubuntu-latest
    env:
      RAMA: ${{ inputs.rama || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Abrir o actualizar el PR y avisar al mentor
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MENTOR_CHAT_ID: ${{ secrets.MENTOR_CHAT_ID }}
          REGISTRO_KEY: ${{ secrets.REGISTRO_KEY }}
        run: |
          SEMANA="${RAMA#claude/}"
          node scripts/resumen-semana.mjs "$SEMANA" > resumen.md
          TITULO="$(head -1 resumen.md | sed 's/^## //')"
          PR=$(gh pr list --head "$RAMA" --state open --json url -q '.[0].url')
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --body-file resumen.md
            node scripts/notificar.mjs propuesta "$SEMANA" "$PR" actualizada
          else
            PR=$(gh pr create --base main --head "$RAMA" --title "$TITULO" --body-file resumen.md)
            node scripts/notificar.mjs propuesta "$SEMANA" "$PR"
          fi
