name: Aviso diario

on:
  # La hora la lleva el bot de registro (scripts/bot-registro.mjs), porque los horarios de GitHub no son confiables.
  # 7:00 am de Ciudad de México.
  workflow_dispatch:
    inputs:
      fecha:
        description: "Fecha a enviar (AAAA-MM-DD). Vacío = hoy."
        required: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Armar el contenido publicado
        run: node scripts/construir.mjs
      - name: Publicar el aviso del día en Telegram
        run: node scripts/aviso-diario.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROUP_CHAT_ID: ${{ secrets.GROUP_CHAT_ID }}
          FECHA: ${{ inputs.fecha }}
